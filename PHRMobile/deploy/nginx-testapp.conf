# Nginx vhost for testapp.zerotoken.in — PHRMobile (patient PHR PWA)
# Self-contained: 80→443 redirect AND HTTPS server block.

# ── HTTP : redirect to HTTPS (ACME challenges stay on port 80) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name testapp.zerotoken.in;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS : serve the static SPA ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testapp.zerotoken.in;

    ssl_certificate     /etc/letsencrypt/live/testapp.zerotoken.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testapp.zerotoken.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/zerotoken/testapp;
    index index.html;

    # Cache hashed assets aggressively — Vite emits content-hashed filenames.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every unknown route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry HTML so deployed code rolls out immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf application/font-woff;
}
