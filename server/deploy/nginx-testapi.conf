# Nginx vhost for testapi.zerotoken.in — reverse proxy → Node app on 127.0.0.1:5000
# Self-contained: includes the 80→443 redirect AND the HTTPS server block.
#
# Cert files come from certbot (run once via server-setup.sh or `certbot --nginx`).
# Once /etc/letsencrypt/live/testapi.zerotoken.in/ exists this file is idempotent —
# deploy.sh can overwrite it without breaking TLS.

# ── HTTP : redirect everything except ACME challenges to HTTPS ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name testapi.zerotoken.in;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS : terminate TLS and reverse-proxy to the Node app ──────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testapi.zerotoken.in;

    ssl_certificate     /etc/letsencrypt/live/testapi.zerotoken.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testapi.zerotoken.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Generous upload size for medical docs / lab reports.
    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 75s;
    }
}
